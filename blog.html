<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
        }
        .video-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bienvenido a mi Blog</h1>
        <p>En esta entrada del blog, quiero compartir un video muy interesante de YouTube.</p>

        <hr>

        <h3>Opción 1: Enlace directo</h3>
        <p>Haz clic en el siguiente enlace para ver el video:</p>
        <a href="https://youtu.be/ES5rc_k0sSE" target="_blank">Ver video en YouTube</a>

        <br><br>

        <h3>Opción 2: Video incrustado</h3>
        <p>También puedes ver el video directamente aquí:</p>
        <div class="video-container">
            <iframe width="560" height="315" 
                src="b.mp4" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
